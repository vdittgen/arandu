# Egress firewall eval suite (locked agent, manual-only).
#
# Inputs carry the prompt + the calling agent's max_tier; the firewall
# returns an EgressDecision (route in {remote, local, blocked} plus the
# resolved max_tier). The suite runs entirely offline — the firewall is
# rule-based.
#
# In Arandu every prompt routes to the local Ollama backend regardless
# of tier, and nothing egresses. Tier classification is still asserted
# since it drives the audit log.
#
# The `requires_redaction` / `requires_consent` fields these cases used
# to assert were removed with the dead tier-routing seam: they were
# hardcoded false and read by nothing. Route + tier are the decision's
# whole observable surface now.
#
# sensitivity_tier: N/A

cases:
  - name: tier1_routes_local_clean
    inputs:
      prompt: "Summarize my preferences."
      agent_max_tier: 1
    expected_output: null
    evaluators:
      - {FieldEquals: {field: route, value: local}}
      - {IntInRange: {field: max_tier, lo: 1, hi: 1}}

  - name: tier2_routes_local
    inputs:
      prompt: "Tell me about my meeting with Alice tomorrow."
      agent_max_tier: 2
    expected_output: null
    evaluators:
      - {FieldEquals: {field: route, value: local}}
      - {IntInRange: {field: max_tier, lo: 2, hi: 2}}

  - name: tier3_health_routes_local
    inputs:
      prompt: "I have been struggling with depression."
      agent_max_tier: 2
    expected_output: null
    evaluators:
      - {FieldEquals: {field: route, value: local}}
      - {IntInRange: {field: max_tier, lo: 3, hi: 3}}

  - name: tier3_finance_routes_local
    inputs:
      prompt: "My bank routing number is 123456."
      agent_max_tier: 1
    expected_output: null
    evaluators:
      - {FieldEquals: {field: route, value: local}}
      - {IntInRange: {field: max_tier, lo: 3, hi: 3}}

evaluators: []
