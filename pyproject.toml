[project]
name = "arandu"
version = "0.5.0b1"
description = "Privacy-first AI operating system - Python data pipeline and ML layer"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "kuzu>=0.11.3",
    "chromadb>=0.5.0",
    "sqlmesh>=0.100.0",
    "ollama>=0.3.0",
    "duckduckgo-search>=7.0.0",
    "pydantic>=2.7.0",
    # Capped below 2.0: pydantic-ai 2.x renamed `OpenAIModel` to
    # `OpenAIChatModel` and turned `ModelProfile` from a dataclass into a
    # TypedDict, both of which this codebase depends on. Unbounded, a
    # fresh install resolves 2.x and every pydantic-ai agent fails at
    # model construction. Lift the cap only together with that migration.
    "pydantic-ai-slim[openai]>=1.104.0,<2",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
voice = [
    "mlx-qwen3-asr>=0.1.0",
]
voice-fallback = [
    "faster-whisper>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.15.15",
    # Capped in lockstep with pydantic-ai-slim above. These ship from one
    # monorepo and pydantic-evals pins its sibling *exactly*
    # (pydantic-evals 2.21.0 requires pydantic-ai-slim==2.21.0), so left
    # unbounded it only lands on a 1.x release because the resolver
    # backtracks there — across 140 candidate versions, and only as long
    # as whatever installs this backtracks the same way. Stating the
    # bound makes the pairing intentional instead of emergent.
    "pydantic-evals>=0.0.50,<2",
]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# The apple bridge embeds AppleScript source as Python triple-quoted strings.
# AppleScript lines aren't reflowable without `¬` continuations that hurt
# readability and AppleScript parser tolerance, so E501 is waived here.
"src/extensions/bridges/apple/server.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# Non-Python runtime assets. Without this setuptools ships only *.py and
# the installed package is silently incomplete: `pip install` was
# dropping all 18 frozen prompt templates, all 16 SQLMesh models, the
# WhatsApp node bridge and every connector manifest. Nothing surfaced
# it, because the desktop bundle puts the source tree on sys.path ahead
# of site-packages — so only code importing `src.*` from an installed
# copy (the Pro CLI) ever hit it, as
# "prompt template not found: .../site-packages/src/models/prompts/...".
#
# Scoped by extension rather than by path so a new asset in an existing
# package is covered by default. `src/interface` has no __init__.py, so
# packages.find never picks it up and the frontend .ts/.tsx are not
# candidates here.
[tool.setuptools.package-data]
"*" = ["*.txt", "*.sql", "*.yaml", "*.yml", "*.json", "*.js"]
